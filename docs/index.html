<!DOCTYPE html>
<html>
<head>
  <base href="/ypdart6/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Практическая работа №6: адаптивная вёрстка, сборка, публикация и тестирование">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Система управления библиотекой — адаптивная версия</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: Arial, sans-serif; background: #fafafa; }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      z-index: 9999;
    }
    .loading-card { text-align: center; color: #263238; }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 4px solid #d7d9e5;
      border-top-color: #3f51b5;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="spinner"></div>
      <strong>Библиотека</strong>
      <div>Загрузка приложения…</div>
    </div>
  </div>
  <script>
    function removeLoading() {
      const loading = document.getElementById('app-loading');
      if (loading) loading.remove();
    }
    window.addEventListener('flutter-first-frame', removeLoading);
    // Fallback: не оставляем HTML-заглушку поверх уже запущенного Flutter.
    window.setTimeout(removeLoading, 10000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
